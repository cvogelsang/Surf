<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surf & Fly Weekender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    body { background: #f1f5f9; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen max-w-md mx-auto">

  <div class="bg-white pt-4 px-4 pb-2 border-b border-gray-100 sticky top-0 z-20">
    <div class="flex items-center justify-between">
      <div class="flex items-baseline space-x-1">
        <h1 class="text-2xl font-black tracking-tight text-slate-800">Surf & Fly</h1>
        <span class="text-xs font-semibold text-blue-500">Weekender</span>
      </div>
      <button onclick="location.reload()" class="text-slate-500 hover:text-blue-500 transition">
        <i class="fas fa-redo-alt text-lg"></i>
      </button>
    </div>
  </div>

  <div class="bg-slate-50 flex-1 px-4 py-6 space-y-4 rounded-t-3xl -mt-6 relative z-10 shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
    <div id="spot-list-container" class="space-y-3">
      <div class="flex items-center justify-between text-[11px] font-bold text-blue-600 bg-blue-50 border border-blue-100 rounded-xl px-3 py-1.5">
        <span id="weekend-label-display">Wochenende wählen...</span>
      </div>

      <div id="spot-list-view" class="space-y-3 max-h-[420px] overflow-y-auto no-scrollbar pt-1"></div>
    </div>

    <div id="spot-detail-view" class="hidden bg-white p-5 rounded-3xl shadow-sm border border-gray-100 space-y-5">
      <div class="flex justify-between items-start">
        <div>
          <h2 id="detail-name" class="text-2xl font-bold text-slate-800">--</h2>
          <p class="text-xs text-gray-500 mt-1 flex items-center">
            <span id="detail-flag" class="mr-1.5">🇵🇹</span>
            <span id="detail-sub">--</span>
          </p>
        </div>
        <div id="detail-score" class="text-white font-bold text-sm px-3 py-2 rounded-xl flex items-center justify-center">--%</div>
      </div>

      <div id="detail-data-source-badge" class="text-[10px] font-bold px-2.5 py-1 rounded-lg inline-block"></div>

      <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-2 -mx-1 px-1">
        <div class="bg-slate-50 border border-slate-100 rounded-2xl p-2.5 text-center min-w-[70px] flex-shrink-0">
          <p id="label-mo" class="text-[9px] uppercase font-bold text-gray-400 tracking-wider">MO</p>
          <p id="wave-mo" class="text-sm font-black text-slate-800 mt-0.5">--</p>
          <p id="period-mo" class="text-[10px] text-gray-500">--</p>
          <p id="wind-mo" class="text-[9px] text-cyan-600 font-medium mt-0.5">--</p>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-2xl p-2.5 text-center min-w-[70px] flex-shrink-0">
          <p id="label-di" class="text-[9px] uppercase font-bold text-gray-400 tracking-wider">DI</p>
          <p id="wave-di" class="text-sm font-black text-slate-800 mt-0.5">--</p>
          <p id="period-di" class="text-[10px] text-gray-500">--</p>
          <p id="wind-di" class="text-[9px] text-cyan-600 font-medium mt-0.5">--</p>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-2xl p-2.5 text-center min-w-[70px] flex-shrink-0">
          <p id="label-mi" class="text-[9px] uppercase font-bold text-gray-400 tracking-wider">MI</p>
          <p id="wave-mi" class="text-sm font-black text-slate-800 mt-0.5">--</p>
          <p id="period-mi" class="text-[10px] text-gray-500">--</p>
          <p id="wind-mi" class="text-[9px] text-cyan-600 font-medium mt-0.5">--</p>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-2xl p-2.5 text-center min-w-[70px] flex-shrink-0">
          <p id="label-do" class="text-[9px] uppercase font-bold text-gray-400 tracking-wider">DO</p>
          <p id="wave-do" class="text-sm font-black text-slate-800 mt-0.5">--</p>
          <p id="period-do" class="text-[10px] text-gray-500">--</p>
          <p id="wind-do" class="text-[9px] text-cyan-600 font-medium mt-0.5">--</p>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-2xl p-2.5 text-center min-w-[70px] flex-shrink-0">
          <p id="label-fr" class="text-[9px] uppercase font-bold text-gray-400 tracking-wider">FR</p>
          <p id="wave-fr" class="text-sm font-black text-slate-800 mt-0.5">--</p>
          <p id="period-fr" class="text-[10px] text-gray-500">--</p>
          <p id="wind-fr" class="text-[9px] text-cyan-600 font-medium mt-0.5">--</p>
        </div>
        <div class="bg-blue-50 border-2 border-blue-500 rounded-2xl p-2.5 text-center min-w-[75px] flex-shrink-0 shadow-sm shadow-blue-50">
          <p id="label-sa" class="text-[9px] uppercase font-bold text-blue-500 tracking-wider">SA</p>
          <p id="wave-sa" class="text-sm font-black text-blue-900 mt-0.5">--</p>
          <p id="period-sa" class="text-[10px] text-blue-600 font-medium">--</p>
          <p id="wind-sa" class="text-[9px] text-blue-700 font-medium mt-0.5">--</p>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-2xl p-2.5 text-center min-w-[70px] flex-shrink-0">
          <p id="label-so" class="text-[9px] uppercase font-bold text-gray-400 tracking-wider">SO</p>
          <p id="wave-so" class="text-sm font-black text-slate-800 mt-0.5">--</p>
          <p id="period-so" class="text-[10px] text-gray-500">--</p>
          <p id="wind-so" class="text-[9px] text-cyan-600 font-medium mt-0.5">--</p>
        </div>
      </div>

      <div class="text-xs text-slate-600 leading-relaxed bg-slate-50/50 p-3 rounded-xl border border-gray-100">
        <strong>Trip Info:</strong> Flüge nach <span id="detail-airport">---</span> ab <span id="detail-price">---</span> verfügbar.
      </div>

      <div class="space-y-2 pt-1">
        <button id="flight-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-2xl transition shadow-md flex items-center justify-center text-sm">
          <span>Flüge & Mietwagen prüfen</span>
        </button>
        <button onclick="showListView()" class="w-full text-center text-xs text-gray-400 pt-2 hover:text-slate-600 transition">
          <i class="fas fa-chevron-left mr-1"></i> Zurück zur Übersicht
        </button>
      </div>
    </div>
  </div>

  <script>
    const surfSpots = [
      { id: 'ericeira', name: 'Ericeira', sub: 'Portugal', flag: '🇵🇹', airport: 'LIS', flightPrice: '124€', lat: 38.96, lng: -9.42 },
      { id: 'hossegor', name: 'Hossegor', sub: 'Frankreich', flag: '🇫🇷', airport: 'BIQ', flightPrice: '145€', lat: 43.66, lng: -1.44 },
      { id: 'peniche', name: 'Peniche', sub: 'Portugal', flag: '🇵🇹', airport: 'LIS', flightPrice: '119€', lat: 39.34, lng: -9.36 },
      { id: 'mundaka', name: 'Mundaka', sub: 'Spanien', flag: '🇪🇸', airport: 'BIO', flightPrice: '132€', lat: 43.40, lng: -2.69 },
      { id: 'jbay', name: 'Jeffreys Bay', sub: 'Südafrika', flag: '🇿🇦', airport: 'PLZ', flightPrice: '670€', lat: -34.02, lng: 24.92 },
      { id: 'umhlanga', name: 'Umhlanga', sub: 'Südafrika', flag: '🇿🇦', airport: 'DUR', flightPrice: '610€', lat: -29.72, lng: 31.09 },
      { id: 'pipeline', name: 'Pipeline', sub: 'Hawaii', flag: '🇺🇸', airport: 'HNL', flightPrice: '890€', lat: 21.66, lng: -158.05 }
    ];

    const days = ['mo', 'di', 'mi', 'do', 'fr', 'sa', 'so'];
    const liveForecastCache = {};

    function getDisplayDates() {
      const today = new Date();
      const friday = new Date(today);
      const currentDay = today.getDay();
      let offset = (5 - currentDay + 7) % 7;
      if (offset === 0 && today.getHours() >= 15) offset = 7;
      friday.setDate(today.getDate() + offset);

      const result = {};
      const labels = ['mo', 'di', 'mi', 'do', 'fr', 'sa', 'so'];
      for (let i = -4; i <= 2; i++) {
        const d = new Date(friday);
        d.setDate(friday.getDate() + i);
        const dayKey = labels[(d.getDay() + 6) % 7];
        result[dayKey] = d.toISOString().split('T')[0];
        result[`${dayKey}Lbl`] = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
      }
      return result;
    }

    function getCardinalFromDegrees(deg) {
      const compass = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const normalized = ((deg % 360) + 360) % 360;
      const index = Math.round(normalized / 22.5) % compass.length;
      return compass[index];
    }

    function getWindDirectionFallback(spot, dayKey = 'sa') {
      const base = {
        mo: 315, di: 300, mi: 285, do: 295, fr: 310, sa: 295, so: 280
      };
      const regionBase = {
        Portugal: 300,
        Frankreich: 310,
        Spanien: 300,
        'Südafrika': 225,
        Hawaii: 60
      };
      const region = spot.sub;
      const ori = regionBase[region] ?? 300;
      const offset = base[dayKey] ?? 295;
      return getCardinalFromDegrees(ori + (offset - 295));
    }

    function calculateDynamicScore(wave) {
      const value = Number(wave) || 1.5;
      if (value >= 2.5) return 95;
      if (value >= 1.8) return 85;
      if (value >= 1.2) return 68;
      return 45;
    }

    function getScoreConfig(score) {
      if (score >= 80) return { bgClass: 'bg-green-500', markerColor: '#22c55e' };
      if (score >= 60) return { bgClass: 'bg-orange-500', markerColor: '#f97316' };
      return { bgClass: 'bg-red-500', markerColor: '#ef4444' };
    }

    function getListViewData() {
      const dates = getDisplayDates();
      const rows = surfSpots.map((spot) => {
        const forecast = liveForecastCache[spot.id];
        const dateKey = dates.sa;
        const dayData = forecast ? forecast[dateKey] : null;
        const wave = dayData && dayData.wave != null ? dayData.wave : 1.5;
        const score = calculateDynamicScore(wave);
        return { spot, score, wave };
      });
      return rows.sort((a, b) => b.score - a.score);
    }

    function renderList() {
      const dates = getDisplayDates();
      const container = document.getElementById('spot-list-view');
      const rows = getListViewData();
      container.innerHTML = rows.map(({ spot, score }) => `
        <div onclick="showSpotDetail('${spot.id}')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer hover:border-blue-300">
          <div>
            <h3 class="font-bold text-lg text-slate-800">${spot.name}</h3>
            <p class="text-xs text-gray-400 mt-0.5">${spot.flag} ${spot.sub}</p>
          </div>
          <div id="list-score-${spot.id}" class="${getScoreConfig(score).bgClass} text-white font-bold text-xs px-2.5 py-1.5 rounded-xl min-w-[42px] text-center">${score}%</div>
        </div>
      `).join('');
      document.getElementById('weekend-label-display').innerText = `WE: ${dates.frLbl} bis ${dates.soLbl}`;
    }

    async function fetchForecastForSpot(spot, dates) {
      const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lng}&hourly=swell_wave_height,wind_direction_10m&start_date=${dates.mo}&end_date=${dates.so}`;
      const resp = await fetch(url);
      const data = await resp.json();

      const hourlyTime = data?.hourly?.time || [];
      const waveData = data?.hourly?.swell_wave_height || [];
      const windData = data?.hourly?.wind_direction_10m || [];
      const result = {};

      days.forEach((dayKey) => {
        const dateStr = dates[dayKey];
        const indexes = hourlyTime
          .map((time, idx) => (time.startsWith(dateStr) ? idx : -1))
          .filter((index) => index >= 0);

        if (indexes.length === 0) {
          result[dateStr] = { wave: null, direction: getWindDirectionFallback(spot, dayKey) };
          return;
        }

        const midIndex = indexes[Math.min(Math.floor(indexes.length / 2), indexes.length - 1)];
        const wave = Number(waveData[midIndex]);
        const directionDeg = Number(windData[midIndex]);
        result[dateStr] = {
          wave: Number.isFinite(wave) ? wave : null,
          direction: Number.isFinite(directionDeg) ? getCardinalFromDegrees(directionDeg) : getWindDirectionFallback(spot, dayKey)
        };
      });

      return result;
    }

    async function refreshForecasts() {
      const dates = getDisplayDates();
      await Promise.all(surfSpots.map(async (spot) => {
        try {
          const data = await fetchForecastForSpot(spot, dates);
          liveForecastCache[spot.id] = data;
        } catch (error) {
          console.warn('Forecast error', spot.name, error);
          liveForecastCache[spot.id] = { [dates.sa]: { wave: null, direction: getWindDirectionFallback(spot, 'sa') } };
        }
      }));
      renderList();
    }

    async function showSpotDetail(spotId) {
      const spot = surfSpots.find((entry) => entry.id === spotId);
      if (!spot) return;

      document.getElementById('spot-list-container').classList.add('hidden');
      document.getElementById('spot-detail-view').classList.remove('hidden');

      document.getElementById('detail-name').innerText = spot.name;
      document.getElementById('detail-flag').innerText = spot.flag;
      document.getElementById('detail-sub').innerText = spot.sub;
      document.getElementById('detail-airport').innerText = spot.airport;
      document.getElementById('detail-price').innerText = spot.flightPrice;

      const dates = getDisplayDates();
      const selectedAirport = 'BER';
      document.getElementById('flight-btn').onclick = () => {
        const url = `https://www.google.com/travel/flights?q=Flights%20to%20${spot.airport}%20from%20${selectedAirport}%20on%20${dates.fr}%20through%20${dates.so}`;
        window.open(url, '_blank');
      };

      const sourceBadge = document.getElementById('detail-data-source-badge');
      sourceBadge.innerText = '🌐 Live Open-Meteo Winddaten';
      sourceBadge.className = 'text-[10px] font-bold px-2.5 py-1 rounded-lg bg-blue-100 text-blue-800';

      const forecastData = liveForecastCache[spot.id] || {};
      let saWave = 1.5;

      days.forEach((dayKey) => {
        const dateKey = dates[dayKey];
        const dayValue = forecastData[dateKey] || { wave: null, direction: getWindDirectionFallback(spot, dayKey) };
        const waveVal = dayValue.wave != null ? Number(dayValue.wave) : null;
        const direction = dayValue.direction || getWindDirectionFallback(spot, dayKey);
        const waveText = waveVal != null ? `${waveVal.toFixed(1)}m` : '--';
        const periodText = waveVal != null ? '12s' : '--';
        document.getElementById(`wave-${dayKey}`).innerText = waveText;
        document.getElementById(`period-${dayKey}`).innerText = periodText;
        document.getElementById(`wind-${dayKey}`).innerText = direction;
        if (dayKey === 'sa' && waveVal != null) saWave = waveVal;
      });

      const score = calculateDynamicScore(saWave);
      const scoreConfig = getScoreConfig(score);
      document.getElementById('detail-score').innerText = `${score}%`;
      document.getElementById('detail-score').className = `text-white font-bold text-sm px-3 py-2 rounded-xl ${scoreConfig.bgClass}`;

      days.forEach((dayKey) => {
        document.getElementById(`label-${dayKey}`).innerHTML = `${dayKey.toUpperCase()}<br><span class="text-[8px] font-normal block mt-0.5">${dates[`${dayKey}Lbl`]}</span>`;
      });
    }

    function showListView() {
      document.getElementById('spot-detail-view').classList.add('hidden');
      document.getElementById('spot-list-container').classList.remove('hidden');
    }

    async function init() {
      const dates = getDisplayDates();
      document.getElementById('weekend-label-display').innerText = `WE: ${dates.frLbl} bis ${dates.soLbl}`;
      await refreshForecasts();
      renderList();
    }

    init();
  </script>
</body>
</html>
