            { id: "dakar", name: "Ngor Right", sub: "Senegal", flag: "🇸🇳", airport: "DSS", flightPrice: "410€", lat: 14.75, lng: -17.51, kontinent: "Afrika", campInfo: "Konstantes Riffkinn mit viel Power", defaultForecast: { sa: 2.0, p: 14 } },

            // AMERIKA
            { id: "pipeline", name: "Pipeline", sub: "Hawaii, USA", flag: "🇺🇸", airport: "HNL", flightPrice: "890€", lat: 21.66, lng: -158.05, kontinent: "Amerika", campInfo: "Die hohlste und schlimmste Welle der Welt", defaultForecast: { sa: 2.8, p: 18 } },
            { id: "malibu", name: "Malibu", sub: "Kalifornien, USA", flag: "🇺🇸", airport: "LAX", flightPrice: "490€", lat: 34.03, lng: -118.67, kontinent: "Amerika", campInfo: "Klassische Pointbreaks und perfektes Licht", defaultForecast: { sa: 1.8, p: 13 } },
            { id: "chicama", name: "Chicama", sub: "Peru", flag: "🇵🇪", airport: "TRU", flightPrice: "820€", lat: -7.70, lng: -79.43, kontinent: "Amerika", campInfo: "Die längste linke Welle der Welt", defaultForecast: { sa: 2.5, p: 16 } },

            // ASIEN
            { id: "uluwatu", name: "Uluwatu", sub: "Bali, Indonesien", flag: "🇮🇩", airport: "DPS", flightPrice: "790€", lat: -8.81, lng: 115.08, kontinent: "Asien", campInfo: "Konstanter, schneidender Reefbreak", defaultForecast: { sa: 2.1, p: 15 } },
            { id: "padang", name: "Padang Padang", sub: "Bali, Indonesien", flag: "🇮🇩", airport: "DPS", flightPrice: "790€", lat: -8.81, lng: 115.10, kontinent: "Asien", campInfo: "Die perfekte Welle im perfektem Rahmen", defaultForecast: { sa: 2.2, p: 15 } },
            { id: "siargao", name: "Cloud 9", sub: "Philippinen", flag: "🇵🇭", airport: "IAO", flightPrice: "880€", lat: 9.81, lng: 126.16, kontinent: "Asien", campInfo: "Heftige Barrels direkt am Kantenpunkt", defaultForecast: { sa: 2.3, p: 15 } }
        ];

        let map;
        let mapMarkers = [];
        let currentRegion = "Europa";
        let baseAnchorDate = new Date();
        const liveForecastCache = {};

        function getScoreConfig(score) {
            if (score >= 80) return { bgClass: 'bg-green-500', markerColor: '#22c55e' };
            if (score >= 60) return { bgClass: 'bg-orange-500', markerColor: '#f97316' };
            return { bgClass: 'bg-red-500', markerColor: '#ef4444' };
        }

        function getCalculatedWeekDays() {
            const current = new Date(baseAnchorDate);
            const currentDay = current.getDay();
            
            let distanceToFriday = (5 - currentDay + 7) % 7;
            if (distanceToFriday === 0 && current.getHours() >= 15 && !document.getElementById('date-picker-input').value) {
                distanceToFriday = 7;
            }
            
            const fridayDate = new Date(current);
            fridayDate.setDate(current.getDate() + distanceToFriday);

            const weekDates = {};
            const labels = ["mo", "di", "mi", "do", "fr", "sa", "so"];
            
            for(let i = -4; i <= 2; i++) {
                const d = new Date(fridayDate);
                d.setDate(fridayDate.getDate() + i);
                const dayLabel = labels[(d.getDay() + 6) % 7];
                weekDates[dayLabel] = d.toISOString().split('T')[0];
                weekDates[dayLabel + "Lbl"] = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
            }
            return weekDates;
        }

        function isFutureClimateMode() {
            const dates = getCalculatedWeekDays();
            const saDate = new Date(dates.sa);
            const today = new Date();
            const diffTime = Math.abs(saDate - today);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays > 11;
        }

        function calculateDynamicScore(waveHeight) {
            let height = parseFloat(waveHeight);
            if (isNaN(height)) height = 1.5;
            if (height >= 2.5) return 95;
            if (height >= 1.8) return 85;
            if (height >= 1.2) return 68;
            return 45;
        }

        function getDayForecastForSpot(spot, dates, fallbackDateKey = 'sa') {
            if (!liveForecastCache[spot.id]) {
                const fallbackScore = calculateDynamicScore(spot.defaultForecast.sa);
                return {
                    score: fallbackScore,
                    waveHeight: spot.defaultForecast.sa,
                    period: spot.defaultForecast.p,
                    source: 'historical'
                };
            }

            const liveData = liveForecastCache[spot.id];
            const dayKey = dates[fallbackDateKey] || fallbackDateKey;
            const dayForecast = liveData[dayKey] || null;
            const waveHeight = dayForecast && dayForecast.wave != null ? dayForecast.wave : spot.defaultForecast.sa;
            const period = dayForecast && dayForecast.period != null ? dayForecast.period : spot.defaultForecast.p;
            const score = calculateDynamicScore(waveHeight);

            return {
                score,
                waveHeight,
                period,
                source: liveData.source || 'live'
            };
        }

        async function fetchForecastForSpot(spot, dates) {
            const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lng}&hourly=swell_wave_height,swell_wave_peak_period&start_date=${dates.mo}&end_date=${dates.so}&timezone=auto`;
            const response = await fetch(url);
            const data = await response.json();

            const hourlyTime = data?.hourly?.time || [];
            const hourlyWave = data?.hourly?.swell_wave_height || [];
            const hourlyPeriod = data?.hourly?.swell_wave_peak_period || [];
            const dailyForecast = {};

            ["mo", "di", "mi", "do", "fr", "sa", "so"].forEach(dayKey => {
                const dateStr = dates[dayKey];
                const dayIndices = hourlyTime
                    .map((time, index) => (time.startsWith(dateStr) ? index : -1))
                    .filter(index => index >= 0);

                if (dayIndices.length === 0) {
                    dailyForecast[dateStr] = { wave: null, period: null };
                    return;
                }

                const midIndex = dayIndices[Math.min(Math.floor(dayIndices.length / 2), dayIndices.length - 1)];
                const wave = Number(hourlyWave[midIndex]);
                const period = Number(hourlyPeriod[midIndex]);
                dailyForecast[dateStr] = {
                    wave: Number.isFinite(wave) ? wave : null,
                    period: Number.isFinite(period) ? period : null
                };
            });

            return dailyForecast;
        }

        async function refreshRegionForecasts() {
            if (isFutureClimateMode()) {
                Object.keys(liveForecastCache).forEach(key => delete liveForecastCache[key]);
                return;
            }

            const dates = getCalculatedWeekDays();
            const filtered = surfSpots.filter(s => s.kontinent === currentRegion);

            await Promise.all(filtered.map(async (spot) => {
                try {
                    const dailyForecast = await fetchForecastForSpot(spot, dates);
                    const saDate = dates.sa;
                    liveForecastCache[spot.id] = {
                        source: 'live',
                        [saDate]: dailyForecast[saDate] || { wave: spot.defaultForecast.sa, period: spot.defaultForecast.p },
                        ...Object.fromEntries(Object.entries(dailyForecast).map(([dateKey, value]) => [dateKey, value]))
                    };
                } catch (error) {
                    liveForecastCache[spot.id] = {
                        source: 'fallback',
                        [dates.sa]: { wave: spot.defaultForecast.sa, period: spot.defaultForecast.p }
                    };
                }
            }));

            renderSpotList();
        }

        function renderSpotList() {
            const dates = getCalculatedWeekDays();
            const container = document.getElementById('spot-list-view');
            container.innerHTML = '';

            const filtered = surfSpots.filter(s => s.kontinent === currentRegion);
            filtered.forEach(spot => {
                const summary = getDayForecastForSpot(spot, dates, 'sa');
                const scoreConfig = getScoreConfig(summary.score);
                const markerColor = scoreConfig.markerColor;
                const bgScoreClass = scoreConfig.bgClass;

                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color: ${markerColor}; width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3);"></div>`,
                    iconSize: [14, 14]
                });

                const existingMarker = mapMarkers.find(m => m.id === spot.id);
                if (existingMarker) {
                    existingMarker.marker.setIcon(customIcon);
                } else {
                    const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(map);
                    marker.on('click', () => showSpotDetail(spot.id));
                    mapMarkers.push({ id: spot.id, marker });
                }

                container.innerHTML += `
                    <div onclick="showSpotDetail('${spot.id}')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer hover:border-blue-200 transition">
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">${spot.name}</h3>
                            <p class="text-xs text-gray-400 mt-0.5">${spot.flag} ${spot.sub}</p>
                        </div>
                        <div id="list-score-${spot.id}" class="${bgScoreClass} text-white font-bold text-xs px-2.5 py-1.5 rounded-xl min-w-[42px] text-center">
                            ${summary.score}%
                        </div>
                    </div>
                `;
            });
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([41.5, -5.5], 5);
            L.tileLayer(`https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`).addTo(map);
            
            document.getElementById('date-picker-input').addEventListener('change', (e) => {
                if (e.target.value) {
                    baseAnchorDate = new Date(e.target.value);
                    updateUI();
                }
            });

            updateUI();
        }

        async function updateUI() {
            const dates = getCalculatedWeekDays();
            document.getElementById('weekend-label-display').innerText = `WE: ${dates.frLbl} bis ${dates.soLbl}`;

            const banner = document.getElementById('climate-warning-banner');
            if (isFutureClimateMode()) banner.classList.remove('hidden');
            else banner.classList.add('hidden');

            ["Europa", "Afrika", "Amerika", "Asien"].forEach(reg => {
                const btn = document.getElementById(`btn-${reg}`);
                if(btn) {
                    btn.className = reg === currentRegion 
                        ? "bg-blue-600 text-white font-bold text-sm px-5 py-2 rounded-full transition shadow-sm" 
                        : "bg-slate-100 text-blue-900 font-bold text-sm px-5 py-2 rounded-full hover:bg-slate-200";
                }
            });

            mapMarkers.forEach(obj => map.removeLayer(obj.marker));
            mapMarkers = [];

            renderSpotList();

            if (!isFutureClimateMode()) {
                await refreshRegionForecasts();
            }

            if (currentRegion === "Europa") map.flyTo([41.5, -5.5], 4);
            if (currentRegion === "Afrika") map.flyTo([12.0, 10.0], 3);
            if (currentRegion === "Amerika") map.flyTo([20.0, -90.0], 3);
            if (currentRegion === "Asien") map.flyTo([5.0, 110.0], 3);
        }

        function filterRegion(regionName) {
            currentRegion = regionName;
            showListView();
            updateUI();
        }

        async function ensureSpotForecast(spot, dates) {
            if (isFutureClimateMode()) {
                return null;
            }

            const cached = liveForecastCache[spot.id];
            if (cached && cached.source === 'live') {
                return cached;
            }

            try {
                const dailyForecast = await fetchForecastForSpot(spot, dates);
                const updatedData = {
                    source: 'live',
                    ...Object.fromEntries(Object.entries(dailyForecast).map(([dateKey, value]) => [dateKey, value]))
                };
                liveForecastCache[spot.id] = updatedData;
                return updatedData;
            } catch (error) {
                liveForecastCache[spot.id] = {
                    source: 'fallback',
                    [dates.sa]: { wave: spot.defaultForecast.sa, period: spot.defaultForecast.p }
                };
                return liveForecastCache[spot.id];
            }
        }

        async function showSpotDetail(spotId) {
            const spot = surfSpots.find(s => s.id === spotId);
            if (!spot) return;

            document.getElementById('spot-list-container').classList.add('hidden');
            document.getElementById('spot-detail-view').classList.remove('hidden');

            document.getElementById('detail-name').innerText = spot.name;
            document.getElementById('detail-flag').innerText = spot.flag;
            document.getElementById('detail-sub').innerText = spot.sub;
            document.getElementById('detail-airport').innerText = spot.airport;
            document.getElementById('detail-price').innerText = spot.flightPrice;
            document.getElementById('detail-camp').innerText = spot.campInfo;

            map.flyTo([spot.lat, spot.lng], 7, { duration: 1 });

            const dates = getCalculatedWeekDays();
            const selectedAirport = document.getElementById('airport-selector').value;

            const days = ["mo", "di", "mi", "do", "fr", "sa", "so"];
            days.forEach(d => {
                document.getElementById(`label-${d}`).innerHTML = `${d.toUpperCase()}<br><span class="text-[8px] font-normal block mt-0.5">${dates[d + "Lbl"]}</span>`;
            });

            document.getElementById('flight-btn').onclick = () => {
                const url = `https://www.google.com/travel/flights?q=Flights%20to%20${spot.airport}%20from%20${selectedAirport}%20on%20${dates.fr}%20through%20${dates.so}`;
                window.open(url, '_blank');
            };

            const sourceBadge = document.getElementById('detail-data-source-badge');

            if (isFutureClimateMode()) {
                sourceBadge.innerText = "📊 Historische Klimadaten (Forecast > 11 Tage)";
                sourceBadge.className = "text-[10px] font-bold px-2.5 py-1 rounded-lg bg-amber-100 text-amber-800";

                days.forEach(d => {
                    let factor = d === "sa" ? 1.0 : (d === "fr" ? 0.9 : 0.85);
                    let h = (parseFloat(spot.defaultForecast.sa) * factor).toFixed(1);
                    document.getElementById(`wave-${d}`).innerText = `${h}m`;
                    document.getElementById(`period-${d}`).innerText = `${spot.defaultForecast.p}s`;
                });

                const dynamicScore = calculateDynamicScore(spot.defaultForecast.sa);
                const scoreBadge = document.getElementById('detail-score');
                scoreBadge.innerText = `${dynamicScore}%`;
                const scoreConfig = getScoreConfig(dynamicScore);
                scoreBadge.className = `text-white font-bold text-sm px-3 py-2 rounded-xl ${scoreConfig.bgClass}`;
                return;
            }

            sourceBadge.innerText = "🌐 Live OpenSea Ocean-Forecast";
            sourceBadge.className = "text-[10px] font-bold px-2.5 py-1 rounded-lg bg-blue-100 text-blue-800";

            const forecastData = await ensureSpotForecast(spot, dates);
            const activeForecast = forecastData || {};
            let saWaveHeight = spot.defaultForecast.sa;

            days.forEach(d => {
                const dateKey = dates[d];
                const dayValue = activeForecast[dateKey];
                const waveValue = dayValue && dayValue.wave != null ? dayValue.wave : null;
                const periodValue = dayValue && dayValue.period != null ? dayValue.period : spot.defaultForecast.p;

                if (waveValue != null) {
                    document.getElementById(`wave-${d}`).innerText = `${waveValue.toFixed(1)}m`;
                    if (d === 'sa') saWaveHeight = waveValue;
                } else {
                    document.getElementById(`wave-${d}`).innerText = `${spot.defaultForecast.sa.toFixed(1)}m`;
                }

                document.getElementById(`period-${d}`).innerText = `${Math.round(periodValue)}s`;
            });

            const dynamicScore = calculateDynamicScore(saWaveHeight);
            const scoreBadge = document.getElementById('detail-score');
            scoreBadge.innerText = `${dynamicScore}%`;
            const scoreConfig = getScoreConfig(dynamicScore);
            scoreBadge.className = `text-white font-bold text-sm px-3 py-2 rounded-xl ${scoreConfig.bgClass}`;

            const listScore = document.getElementById(`list-score-${spot.id}`);
            if (listScore) {
                listScore.className = `${scoreConfig.bgClass} text-white font-bold text-xs px-2.5 py-1.5 rounded-xl min-w-[42px] text-center`;
                listScore.innerText = `${dynamicScore}%`;
            }

            const markerMatch = mapMarkers.find(m => m.id === spot.id);
            if (markerMatch) {
                markerMatch.marker.setIcon(L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color: ${scoreConfig.markerColor}; width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3);"></div>`,
                    iconSize: [14, 14]
                }));
            }
        }

        function showListView() {
            document.getElementById('spot-detail-view').classList.add('hidden');
            document.getElementById('spot-list-container').classList.remove('hidden');
            if (currentRegion === "Europa") map.flyTo([41.5, -5.5], 4);
        }

        window.onload = initMap;
    </script>
